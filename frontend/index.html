<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Smart Tamagotchi</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Tiny5&family=VT323&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/highlight-github.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <!-- Spotify "now playing" as a retro walkman (hidden until Spotify is connected) -->
    <aside class="walkman" id="walkman" hidden aria-label="Now playing on Spotify">
      <div class="walkman-top">
        <span class="walkman-brand">TAMA♥WALK</span>
        <span class="walkman-right">
          <span class="walkman-led" title="playing"></span>
          <button type="button" class="walkman-close" id="walkman-close" aria-label="Close walkman" title="Close (reopen from the music icon)">×</button>
        </span>
      </div>
      <div class="cassette">
        <div class="cassette-label">
          <canvas class="walkman-art" id="walkman-art" width="20" height="20"></canvas>
          <div class="cassette-text">
            <div class="marquee"><span id="walkman-title">Nothing playing</span></div>
            <div class="walkman-artist" id="walkman-artist"></div>
          </div>
        </div>
        <div class="cassette-window" aria-hidden="true"><i class="reel"></i><i class="tape"></i><i class="reel"></i></div>
      </div>
      <div class="walkman-progress"><i id="walkman-bar"></i></div>
      <div class="walkman-buttons">
        <button type="button" data-sp="previous" aria-label="Previous">◀◀</button>
        <button type="button" data-sp="toggle" id="walkman-toggle" aria-label="Play or pause">▶</button>
        <button type="button" data-sp="next" aria-label="Next">▶▶</button>
      </div>
    </aside>

    <div class="device-wrap">
      <div class="keyring" aria-hidden="true"></div>
      <div class="device">
        <!-- printed hearts & stars on the shell -->
        <div class="prints" aria-hidden="true">
          <i class="px heart p1"></i><i class="px heart p2"></i><i class="px heart p3"></i>
          <i class="px heart p4"></i><i class="px heart p5"></i><i class="px heart p6"></i>
          <i class="px sparkle p7"></i><i class="px sparkle p8"></i><i class="px sparkle p9"></i>
          <i class="px sparkle p10"></i>
        </div>

        <div class="brand">TAMA<span>♥</span>SMART</div>

        <div class="bezel">
            <!-- status light (not a button): blinks when the pet needs attention -->
            <span class="attention-led" id="attention-led" title="needs attention" aria-hidden="true"><canvas width="3" height="8"></canvas></span>
          <div class="lcd" id="lcd">
            <div class="icons" id="icons-top"></div>
            <div class="screen">
              <canvas id="screen" width="48" height="32"></canvas>
              <div class="lcd-weather" id="lcd-weather" hidden><canvas width="5" height="5"></canvas><span></span></div>
              <div class="overlay" id="overlay" hidden></div>
              <div class="bubble" id="bubble" hidden></div>
            </div>
            <div class="icons" id="icons-bottom"></div>
          </div>
        </div>

        <div class="buttons">
          <button class="btn" data-btn="A" aria-label="A: next icon"></button>
          <button class="btn btn-b" data-btn="B" aria-label="B: select"></button>
          <button class="btn" data-btn="C" aria-label="C: back"></button>
        </div>
        <div class="btn-labels" aria-hidden="true"><span>A</span><span>B</span><span>C</span></div>
      </div>
    </div>

    <section class="chat" id="chat" hidden aria-label="Chat with your pet">
      <header class="chat-title">
        <span>♥ CHAT.EXE</span>
        <span class="chat-actions">
          <button class="chat-voice" id="chat-voice" aria-pressed="true" aria-label="Read replies aloud">♪ ON</button>
          <button class="chat-close" id="chat-close" aria-label="Close chat">×</button>
        </span>
      </header>
      <div class="chat-log" id="chat-log" aria-live="polite"></div>
      <form class="chat-form" id="chat-form">
        <button type="button" class="chat-mic" id="chat-mic" aria-label="Talk">MIC</button>
        <label class="chat-attach" title="Add a .txt, .md, .docx or .pdf to your library">+<input type="file" id="chat-file" accept=".txt,.md,.markdown,.pdf,.docx" hidden></label>
        <input id="chat-input" type="text" maxlength="4000" autocomplete="off" placeholder="Type or press MIC...">
        <button type="submit" class="chat-send">SEND</button>
      </form>
    </section>
    <section class="window outfits" id="outfits" hidden aria-label="Choose an outfit">
      <header class="chat-title">
        <span>♥ OUTFITS.EXE</span>
        <button class="chat-close" id="outfits-close" aria-label="Close outfits">×</button>
      </header>
      <div class="outfit-list" id="outfit-list"></div>
      <p class="outfit-tip">Or just ask in the chat, e.g. "put on something Christmassy"</p>
    </section>
    <section class="window mirror" id="mirror" hidden aria-label="Mirror mode">
      <header class="chat-title">
        <span>♥ MIRROR.EXE</span>
        <button class="chat-close" id="mirror-close" aria-label="Close mirror">×</button>
      </header>
      <div class="mirror-stage">
        <video id="mirror-video" playsinline muted autoplay></video>
        <img id="mirror-still" alt="Your outfit photo" hidden>
        <p class="mirror-note" id="mirror-note" hidden></p>
      </div>
      <div class="mirror-controls">
        <button type="button" id="mirror-flip" hidden>FLIP</button>
        <button type="button" id="mirror-snap" class="primary">SNAP</button>
        <label class="mirror-file" id="mirror-file-label" hidden>
          PICK PHOTO
          <input type="file" id="mirror-file" accept="image/*" capture="user">
        </label>
        <button type="button" id="mirror-retake" hidden>RETAKE</button>
        <button type="button" id="mirror-send" class="primary" hidden>SEND</button>
      </div>
    </section>
    <section class="window weather" id="weather" hidden aria-label="Weather">
      <header class="chat-title">
        <span>♥ WEATHER.EXE</span>
        <button class="chat-close" id="weather-close" aria-label="Close weather">×</button>
      </header>
      <form class="weather-search" id="weather-search">
        <input id="weather-city" type="text" placeholder="Search a city..." autocomplete="off" maxlength="60">
        <button type="submit">GO</button>
        <button type="button" id="weather-home" title="Back to my city">HOME</button>
      </form>
      <div class="weather-body" id="weather-body"></div>
      <div class="weather-actions">
        <button type="button" id="weather-wear">♥ WHAT SHOULD I WEAR?</button>
      </div>
    </section>
    <section class="window calendar" id="calendar" hidden aria-label="Calendar">
      <header class="chat-title">
        <span>♥ CALENDAR.EXE</span>
        <button class="chat-close" id="calendar-close" aria-label="Close calendar">×</button>
      </header>
      <div class="weather-body calendar-body" id="calendar-body"></div>
      <div class="weather-actions">
        <button type="button" id="calendar-wear" disabled>♥ WHAT SHOULD I WEAR FOR IT?</button>
      </div>
    </section>
    <section class="window notifs" id="notifs" hidden aria-label="Notifications">
      <header class="chat-title">
        <span>♥ NOTIFS.EXE</span>
        <button class="chat-close" id="notifs-close" aria-label="Close notifications">×</button>
      </header>
      <div class="weather-body notifs-body" id="notifs-body"></div>
      <div class="weather-actions">
        <button type="button" id="notifs-test">♥ SEND A TEST</button>
      </div>
    </section>
    <!-- Personal knowledge base: books (topics) > chapters (sub-topics) > Markdown notes -->
    <section class="window library" id="library" hidden aria-label="Library">
      <header class="chat-title">
        <span>♥ LIBRARY.EXE</span>
        <button class="chat-close" id="library-close" aria-label="Close library">×</button>
      </header>
      <div class="lib-toolbar">
        <form class="lib-search" id="lib-search" role="search">
          <input type="search" placeholder="Search your notes..." maxlength="200" aria-label="Search your notes">
          <button type="submit" class="lib-btn primary">GO</button>
        </form>
        <button type="button" class="lib-btn" id="lib-new-book">+ BOOK</button>
        <label class="lib-btn lib-import" title="Add a .txt, .md, .docx or .pdf file">
          IMPORT<input type="file" id="lib-import" accept=".txt,.md,.markdown,.pdf,.docx" hidden>
        </label>
      </div>
      <div class="lib-body" id="lib-body"></div>
      <div class="lib-dialog" id="lib-dialog" hidden></div>
    </section>

    <!-- First-time setup wizard (also reopened from the gear icon) -->
    <section class="window wizard" id="wizard" hidden aria-label="Setup">
      <header class="chat-title">
        <span>♥ SETUP.EXE</span>
        <button class="chat-close" id="wizard-close" aria-label="Skip setup">×</button>
      </header>
      <div class="wizard-body" id="wizard-body"></div>
      <div class="wizard-nav">
        <button type="button" id="wizard-back">BACK</button>
        <span class="wizard-dots" id="wizard-dots"></span>
        <button type="button" id="wizard-next" class="primary">NEXT</button>
      </div>
    </section>
  </main>

  <p class="hint">
    <b>A</b> next · <b>B</b> OK · <b>C</b> back
    <span>keyboard: ← / Enter / Esc · click the chat icon to talk</span>
  </p>

  <script src="themes.js"></script>
  <script src="vendor/marked.min.js"></script>
  <script src="vendor/purify.min.js"></script>
  <script src="vendor/highlight.min.js"></script>
  <script src="app.js"></script>
  <script src="library.js"></script>
</body>
</html>
